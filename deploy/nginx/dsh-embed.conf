# 只转发智能助手自己的路径。本机工作台在 /aiworkbench/，人才画像和培训不走这里。
# 工作台自己的接口在 /aiworkbench/api/，下面的 /api/ 只给助手用。

# 助手网页只认根路径 /?token= 才能种登录饼干；工作台仍在 /aiworkbench/
location = / {
    proxy_pass http://127.0.0.1:3081;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_redirect off;
}

location ^~ /sso {
    proxy_pass http://127.0.0.1:3081;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
}

location ^~ /__bind {
    proxy_pass http://127.0.0.1:3081;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
}

location ^~ /logout {
    proxy_pass http://127.0.0.1:3081;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
}

location = /__team_logout.js {
    proxy_pass http://127.0.0.1:3081;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
}

location = /__team_file_download.js {
    proxy_pass http://127.0.0.1:3081;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $http_cookie;
}

location = /favicon.svg {
    proxy_pass http://127.0.0.1:3081;
}

location = /manifest.webmanifest {
    proxy_pass http://127.0.0.1:3081;
}

location = /index.html {
    proxy_pass http://127.0.0.1:3081;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
}

location ^~ /assets/ {
    proxy_pass http://127.0.0.1:3081;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
}

# 官方助手「在应用中打开」等入口；不转会 404。
location ^~ /open-in-app {
    proxy_pass http://127.0.0.1:3081;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
}

# 官方助手的插件脚本与事件流，不转页面会空白；events 为长连接需关缓冲。
location ^~ /plugins {
    proxy_pass http://127.0.0.1:3081;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

location ^~ /api/ {
    proxy_pass http://127.0.0.1:3081;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
