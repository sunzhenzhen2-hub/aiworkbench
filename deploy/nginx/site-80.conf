# 对外入口：仅托管项目支撑工作台（不含人才画像、不含学习流）
# 人才画像：直连 :3000
# 学习流：直连 :7000（不经本 nginx）
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/workbench.conf;
    include /etc/nginx/snippets/dsh-embed.conf;

    location / {
        return 404;
    }
}
