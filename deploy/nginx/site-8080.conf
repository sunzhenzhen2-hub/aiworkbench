# 本机 80 已被其他应用占用时，工作台走 8080
# PC:    http://<server>:8080/aiworkbench/
# 钉钉H5: http://<server>:8080/aiworkbench/m/
server {
    listen 8080 default_server;
    server_name _;

    client_max_body_size 50m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/workbench.conf;
    include /etc/nginx/snippets/dsh-embed.conf;

    location / {
        return 404;
    }
}
