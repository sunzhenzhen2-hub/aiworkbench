# 项目支撑工作台 — nginx 静态托管 + API 反代
# 本机(142)网址与文件夹同名：http://<server>/aiworkbench/
# 钉钉H5: http://<server>/aiworkbench/m/
# 钉钉扫码：若全局开启 CSP，需允许 script-src https://g.alicdn.com 、frame-src https://login.dingtalk.com

# 旧网址 /workbench 跳到 /aiworkbench，避免书签失效
location ^~ /workbench {
    rewrite ^/workbench(.*)$ /aiworkbench$1 permanent;
}

location = /aiworkbench {
    return 301 /aiworkbench/;
}

location = /aiworkbench/m {
    return 301 /aiworkbench/m/;
}


location = /aiworkbench/api/dsh/introspect {
    allow 30.251.255.132;
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:8100/api/dsh/introspect;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
}

# 分析管控 SSE：关缓冲、加长超时，避免流式结论被截断
location ^~ /aiworkbench/api/ai/analyze/ {
    proxy_pass http://127.0.0.1:8100/api/ai/analyze/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header X-Accel-Buffering no;
}

location /aiworkbench/api/ {
    proxy_pass http://127.0.0.1:8100/api/;
    proxy_http_version 1.1;
    # $http_host 保留端口；$host 会丢掉 :18090
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 外层 VPN/TLS 终止时透传；未传则退回本层 $scheme
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

location /aiworkbench/ws/ {
    proxy_pass http://127.0.0.1:8100/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# 钉钉手机 H5（须写在 /aiworkbench/ 之前，避免被 PC 路径吞掉）
location ^~ /aiworkbench/m/assets/ {
    alias /home/aiworkbench/web-dingtalk/dist/assets/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    access_log off;
}

location ^~ /aiworkbench/m/ {
    alias /home/aiworkbench/web-dingtalk/dist/;
    index index.html;
    try_files $uri $uri/ /aiworkbench/m/index.html;
    add_header Cache-Control "no-cache, must-revalidate";
}

location /aiworkbench/assets/ {
    alias /home/aiworkbench/web-pc/dist/assets/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    access_log off;
}

location /aiworkbench/ {
    alias /home/aiworkbench/web-pc/dist/;
    index index.html;
    try_files $uri $uri/ /aiworkbench/index.html;
    add_header Cache-Control "no-cache, must-revalidate";
}
